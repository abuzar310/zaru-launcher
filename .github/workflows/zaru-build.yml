# Zaru's own installer build. The upstream release.yml is fenced to
# millida/launcher and uses Millida's private build containers + signing, so it
# skips on this fork. This one builds the two installers Zaru ships — the
# Windows NSIS setup and the Linux .deb — on GitHub-hosted runners, from
# whatever branch it is dispatched on (zaru-root). No secrets: the Microsoft
# client id is option_env! (public fallback) and the Discord app id has a
# runtime default, so a plain build needs neither.
name: Zaru build

on:
  workflow_dispatch:
  push:
    branches: [ci/zaru-build]

permissions:
  contents: read

# bash everywhere, so the --config JSON quotes the same on Windows and Linux.
defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      # Override beforeBuildCommand to the release web build (skips the tsc gate
      # that `build:web` adds), matching how the upstream release builds.
      - name: Build NSIS installer
        run: bun run tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":"bun run build:web:release"}}'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build deps (Ubuntu 24.04 package names).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Build .deb
        run: bun run tauri build --bundles deb --config '{"build":{"beforeBuildCommand":"bun run build:web:release"}}'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          if-no-files-found: error
          path: src-tauri/target/release/bundle/deb/*.deb
